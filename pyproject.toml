[project]
name = "buildsuite_core"
authors = [
    { name = "Infraholic Innovations Pvt. Ltd", email = "app@buildsuite.io"}
]
description = "A construction operating system built on Frappe"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # Third-party PyPI packages only. Frappe apps go in
    # [tool.bench.frappe-dependencies] below - pip cannot resolve them, which is why the
    # commented-out "frappe~=16.0.0" here could never have worked.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# REQUIRED by Frappe Cloud. press reads exactly one value:
#     pyproject["tool"]["bench"]["frappe-dependencies"]["frappe"]
# from pyproject.toml on the branch selected in the "Add app" dialog. If the section is
# absent the lookup raises, is suppressed, and the dialog reports
#     "Could not find compatible Frappe version in pyproject.toml file."
#
# The upper bound matters: without it `bench update` will pull a v17 frappe against v16
# app code. erpnext@version-16 pins ">=16.21.0,<17.0.0"; the looser floor below matches
# hrms@version-16.
[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

# Apt packages installed from the Ubuntu repositories when hosted on Frappe Cloud.
# Note this is a TOP-LEVEL `deploy` table, not under `tool.bench`: press reads
# pyproject.get("deploy", {}).get("dependencies", {}).get("apt", {}).get("packages", []).
[deploy.dependencies.apt]
packages = []

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
    "UP030", # Use implicit references for positional format fields (translations)
    "UP031", # Use format specifiers instead of percent format
    "UP032", # Use f-string instead of `format` call (translations)
    "UP037", # quoted annotations
    "UP040", # Use type aliases instead of type annotations
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
