[project]
name = "buildsuite_core"
authors = [
    { name = "Infraholic Innovations Pvt. Ltd", email = "app@buildsuite.io"}
]
description = "A construction operating system built on Frappe"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=16.0.0" # Installed and managed by bench.
    # frappe-mcp==0.1.0 itself is installed separately with --no-deps by
    # .devcontainer/bootstrap.sh / ci.yml: its declared "pydantic~=2.11.7" pin
    # resolves to pydantic-core==2.33.2, which has no Python 3.14 wheel and
    # fails to build from source (pyo3-ffi 0.24.1 targets pre-3.14 CPython
    # internals removed in 3.14). pydantic 2.12+ has full 3.14 wheels and no
    # breaking API changes vs 2.11 for frappe-mcp's usage, so we pin its real
    # runtime deps here instead of letting pip resolve frappe-mcp's own bound.
    "pydantic>=2.12,<3",
    # frappe-mcp declares "Werkzeug==3.1.3", but frappe itself pins an exact,
    # different patch (currently 3.1.6) — deliberately NOT pinning Werkzeug
    # here at all, so frappe's own requirement wins instead of silently
    # downgrading the framework's Werkzeug under it. frappe-mcp only touches
    # the stable Request/Response basics, so this is safe across 3.1.x patches.
    "jsonschema>=4.24,<5",
    "click>=8.2,<9",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

# These apt dependencies will be installed from Ubuntu repositories when you host your app on Frappe Cloud
[deploy.dependencies.apt]
packages = []

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
    "UP030", # Use implicit references for positional format fields (translations)
    "UP031", # Use format specifiers instead of percent format
    "UP032", # Use f-string instead of `format` call (translations)
    "UP037", # quoted annotations
    "UP040", # Use type aliases instead of type annotations
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
